version: '3'

vars:
  SOURCE_FILES: >-
    find . -type d \( -name .git -o -name .mygo -o -name .agents -o -name node_modules -o -name vendor -o -name build -o -name dist -o -name graft \) -prune
    -o -type f \( -name '*.go' -o -name '*.ts' -o -name '*.mjs' -o -name '*.css' -o -name '*.html' -o -name '*.yml' -o -name '*.yaml' \) -print0

tasks:
  default:
    desc: 列出可用任务
    cmds:
      - task --list

  setup:
    desc: 安装打包工具与 Go 依赖
    cmds:
      - bun install
      - GOMAXPROCS=2 go mod download

  dev:
    desc: 启动桌面开发模式
    cmds:
      - GOMAXPROCS=2 GOFLAGS=-p=1 bun run dev

  build:
    desc: 构建当前平台应用与安装包
    cmds:
      - GOMAXPROCS=2 GOFLAGS=-p=1 bun run build

  fmt:
    desc: 补齐版权头并使用 golangci-lint 格式化 Go 代码
    aliases: [format]
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
    cmds:
      - task: license
      - task: tools:lint
      - golangci-lint fmt

  tools:lint:
    internal: true
    status:
      - command -v golangci-lint
    cmds:
      - GOMAXPROCS=2 go install -p=1 github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

  tools:vuln:
    internal: true
    status:
      - command -v govulncheck
    cmds:
      - GOMAXPROCS=2 go install -p=1 golang.org/x/vuln/cmd/govulncheck@latest

  tools:license:
    internal: true
    status:
      - command -v addlicense
    cmds:
      - GOMAXPROCS=2 go install -p=1 github.com/google/addlicense@latest

  license:
    desc: 为源码、脚本和配置补齐 AGPL 版权头
    aliases: [gencopyright]
    env:
      GOMAXPROCS: '2'
    cmds:
      - task: tools:license
      - '{{.SOURCE_FILES}} | xargs -0 -n 1 addlicense -c ysicing -l AGPL-3.0-only -s=only'

  license:check:
    desc: 检查源码文件头是否缺失，包含平台专用文件
    run: once
    env:
      GOMAXPROCS: '2'
    cmds:
      - task: tools:license
      - '{{.SOURCE_FILES}} | xargs -0 -n 1 addlicense -check'

  gomod:
    desc: 整理 Go 模块依赖
    cmds:
      - GOMAXPROCS=2 go mod tidy

  fmt:check:
    desc: 检查文件头是否缺失及 Go 格式，不修改源码
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
    cmds:
      - task: license:check
      - task: tools:lint
      - golangci-lint fmt --diff

  lint:
    desc: 使用 golangci-lint 检查 Go 文件头、格式及 govet
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
    cmds:
      - task: license:check
      - task: tools:lint
      - golangci-lint run ./...

  govulncheck:
    desc: 检查当前构建可调用代码的已知漏洞（需要联网）
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
    cmds:
      - task: tools:vuln
      - govulncheck ./...

  vet:
    desc: 检查 Go 代码
    cmds:
      - GOMAXPROCS=2 go vet -p=1 ./...

  test:
    desc: 串行运行 Go（含原生界面）与发布脚本测试
    cmds:
      - task: test:go
      - task: test:release

  test:go:
    desc: 运行 Go 测试
    cmds:
      - GOMAXPROCS=2 go test -p=1 -parallel=2 ./...

  test:ui:
    desc: 运行原生界面与交互测试
    cmds:
      - GOMAXPROCS=2 go test -p=1 -parallel=2 ./internal/app

  test:release:
    desc: 运行发布脚本测试
    cmds:
      - bun run test:release

  check:
    desc: 串行运行文件头与格式检查、全部测试及 golangci-lint
    cmds:
      - task: fmt:check
      - task: test
      - task: lint

  release:
    desc: 构建并发布双架构更新包，可传入 -- --dry-run 仅构建校验
    cmds:
      - GOMAXPROCS=2 GOFLAGS=-p=1 bun run release {{.CLI_ARGS}}

  publish:
    desc: 发布已有产物，使用 -- --dir build/release-实际目录，可加 --dry-run
    cmds:
      - bun run publish {{.CLI_ARGS}}
