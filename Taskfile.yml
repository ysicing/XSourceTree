version: '3'

tasks:
  default:
    desc: 列出可用任务
    cmds:
      - task --list

  setup:
    desc: 安装前端与 Go 依赖
    cmds:
      - bun install
      - GOMAXPROCS=2 go mod download

  dev:
    desc: 启动桌面开发模式
    cmds:
      - GOMAXPROCS=2 GOFLAGS=-p=1 bun run dev

  dev:web:
    desc: 启动前端开发服务
    cmds:
      - bun run dev:web

  generate:
    desc: 生成 Go 服务的 TypeScript 绑定
    cmds:
      - GOMAXPROCS=2 GOFLAGS=-p=1 bun run generate

  build:
    desc: 构建 macOS 应用与 DMG
    cmds:
      - GOMAXPROCS=2 GOFLAGS=-p=1 bun run build

  build:web:
    desc: 检查类型并构建前端
    cmds:
      - bun run build:web

  typecheck:
    desc: 检查 TypeScript 类型
    cmds:
      - bun run typecheck

  test:
    desc: 串行运行 Go、前端与发布脚本测试
    cmds:
      - task: test:go
      - task: test:web
      - task: test:release

  test:go:
    desc: 运行 Go 测试
    cmds:
      - GOMAXPROCS=2 go test -p=1 -parallel=2 ./...

  test:web:
    desc: 运行前端测试
    cmds:
      - bun run test:web

  test:release:
    desc: 运行发布脚本测试
    cmds:
      - bun run test:release

  check:
    desc: 串行运行全部测试、类型检查与前端构建
    cmds:
      - task: test
      - task: build:web

  release:
    desc: 构建并发布双架构更新包，可传入 -- --dry-run 仅构建校验
    cmds:
      - GOMAXPROCS=2 GOFLAGS=-p=1 bun run release {{.CLI_ARGS}}

  publish:
    desc: 发布已有产物，使用 -- --dir build/release-实际目录，可加 --dry-run
    cmds:
      - bun run publish {{.CLI_ARGS}}
