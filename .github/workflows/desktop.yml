name: Desktop platforms

on:
  push:
    branches: [master]
  pull_request:
  # macOS 仍由本地签名、公证、上传 CDN 并公开 Release；这里只补充新平台附件。
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '已公开发布的稳定版本 tag，例如 v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  GOMAXPROCS: '2'
  GOFLAGS: '-p=1'
  CGO_ENABLED: '0'
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || '' }}

jobs:
  test-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Windows x64 (unsigned)
            runner: windows-2022
            platform: windows-amd64
          - name: Ubuntu x64
            runner: ubuntu-24.04
            platform: linux-amd64
          - name: macOS regression
            runner: macos-15
            platform: darwin-arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Use installed Git safely on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitDirectory = Split-Path (Get-Command git.exe -ErrorAction Stop).Source
          if (-not [IO.Path]::IsPathRooted($gitDirectory)) { throw 'Git PATH must be absolute' }
          $gitDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'NoDefaultCurrentDirectoryInExePath=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Keep checkout and Git fixtures on LF
        run: git config --global core.autocrlf false
      - name: Install Linux runtime and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git libgtk-3-0t64 libsecret-1-0 gnome-keyring xvfb xauth dbus-x11 libgl1-mesa-dri libglx-mesa0 libegl-mesa0
      - run: bun install --frozen-lockfile
      - name: Verify published release and tag before building
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/desktop-release.mjs check --tag "$RELEASE_TAG"
      - name: Go regression tests (Linux)
        if: runner.os == 'Linux'
        env:
          XSOURCETREE_TEST_SCREENSHOTS: ${{ runner.temp }}/51code-screenshots
        run: |
          # 独立的 CI keyring 只存测试的合成凭证，不接触真实用户密钥。
          xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
            printf "%s" "51code-ci-synthetic-only" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            XSOURCETREE_TEST_KEYCHAIN=1 go test -p=1 -parallel=2 ./...
          '
      - name: Go regression tests (macOS and Windows)
        if: runner.os != 'Linux'
        env:
          XSOURCETREE_TEST_KEYCHAIN: ${{ runner.os == 'Windows' && '1' || '' }}
          XSOURCETREE_TEST_SCREENSHOTS: ${{ runner.temp }}/51code-screenshots
        run: go test -p=1 -parallel=2 ./...
      - name: Keep UI Tester screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.platform }}
          path: ${{ runner.temp }}/51code-screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Release script tests
        run: bun test ./scripts
      - name: Build installer or Debian package
        if: runner.os != 'macOS'
        run: bun scripts/desktop-release.mjs build --platform '${{ matrix.platform }}'
      - name: Verify Windows Authenticode status
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $signature = Get-AuthenticodeSignature "build/desktop/windows-amd64/51code-setup-$version-amd64.exe"
          if ($signature.Status -ne 'NotSigned') { throw "Expected unsigned first release, got $($signature.Status)" }
          'Windows x64 首版未提供 Authenticode 签名；请从本仓库 GitHub Release 下载并手动升级。' >> $env:GITHUB_STEP_SUMMARY
      - name: Inspect Ubuntu package metadata
        if: runner.os == 'Linux'
        run: |
          version=$(bun -p 'require("./package.json").version')
          package="build/desktop/linux-amd64/51code_${version}_amd64.deb"
          test "$(dpkg-deb -f "$package" Package)" = 51code
          test "$(dpkg-deb -f "$package" Version)" = "$version"
          test "$(dpkg-deb -f "$package" Architecture)" = amd64
          dpkg-deb --info "$package"
      - name: Record installer source and checksum
        if: runner.os != 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ -n "$RELEASE_TAG" ]; then args=(--tag "$RELEASE_TAG"); fi
          bun scripts/desktop-release.mjs collect --platform '${{ matrix.platform }}' "${args[@]}"
      - name: Keep only installer and provenance for publishing
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            build/desktop/${{ matrix.platform }}/51code-setup-*-amd64.exe
            build/desktop/${{ matrix.platform }}/51code_*_amd64.deb
            build/desktop/${{ matrix.platform }}/desktop-artifact.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Add installers to existing release
    needs: test-build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows-amd64
          path: build/desktop/windows-amd64
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux-amd64
          path: build/desktop/linux-amd64
      # 不运行 mygo publish/-upload，不创建或公开 Release，也不上传 macOS 或更新清单。
      - name: Verify provenance and upload without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/desktop-release.mjs publish --tag "$RELEASE_TAG"
